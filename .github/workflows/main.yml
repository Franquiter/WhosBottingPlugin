name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Fix SDK Path
      shell: pwsh
      run: |
        # Bajamos el SDK oficial
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # Creamos la ruta exacta que pide el compilador
        $targetPath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $targetPath
        
        # Buscamos todos los archivos .h en el SDK y los movemos al destino
        # Esto soluciona el error de "path does not exist"
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $targetPath
        
        # Guardamos la ruta para el compilador
        echo "BAKKESMOD_SDK=$((Get-Item .).FullName)\sdk" >> $env:GITHUB_ENV

    - name: Build Solution
      shell: pwsh
      run: |
        # Creamos el archivo de versión para que no falle el script de powershell
        New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        # Compilamos omitiendo los eventos de pre/post-build que dan error
        msbuild WhosBottingPlugin.sln /p:Configuration=Release /p:Platform="x64" /p:BakkesModPath="${{ env.BAKKESMOD_SDK }}" /p:PreBuildEvent= /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Plugin-Final
        path: |
          **/*.dll
          **/*.set
