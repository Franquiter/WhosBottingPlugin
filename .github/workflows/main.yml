name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Construct SDK Hierarchy
      shell: pwsh
      run: |
        # 1. Descargar el SDK oficial desde el sitio de BakkesMod
        $sdkUrl = "https://github.com/bakkesmodorg/BakkesMod2-Plugins/archive/refs/heads/master.zip"
        Invoke-WebRequest -Uri $sdkUrl -OutFile "sdk.zip"
        Expand-Archive -Path "sdk.zip" -DestinationPath "sdk_temp"
        
        # 2. Definir rutas (basadas en lo que MSBuild busca en tu log)
        $includeRoot = "sdk/bakkesmodsdk/include"
        $finalDir = "$includeRoot/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $finalDir
        
        # 3. Mover los archivos .h de la carpeta extraída
        # Buscamos en la carpeta extraída (que suele tener el nombre del repo-master)
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $finalDir -Force
        
        # 4. TRUCO FINAL: Si el archivo bakkesmodplugin.h sigue faltando, 
        # lo descargamos individualmente desde el mirror público
        if (!(Test-Path "$finalDir/bakkesmodplugin.h")) {
          $rawUrl = "https://raw.githubusercontent.com/thelooter/bakkesmodapi/master/include/bakkesmod/plugin/bakkesmodplugin.h"
          Invoke-WebRequest -Uri $rawUrl -OutFile "$finalDir/bakkesmodplugin.h"
        }

        Write-Host "--- VERIFICACIÓN DE ARCHIVOS ---"
        ls $finalDir

    - name: Build Solution
      shell: pwsh
      run: |
        # Asegurar version.h
        $projPath = "WhosBottingPlugin/WhosBottingPlugin/version.h"
        if (!(Test-Path "WhosBottingPlugin/WhosBottingPlugin")) { $projPath = "WhosBottingPlugin/version.h" }
        New-Item -ItemType File -Path $projPath -Force -Value ""
        
        $absPath = (Get-Item .).FullName
        
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
