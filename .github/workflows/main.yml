name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Force Fix SDK
      shell: pwsh
      run: |
        # 1. Bajamos el SDK
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_source
        
        # 2. Creamos la estructura que el código espera RELATIVAMENTE
        # El código busca <bakkesmod/plugin/file.h>
        # Así que creamos esa carpeta en la raíz del proyecto
        $finalPath = "bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $finalPath
        
        # 3. Metemos todos los archivos .h ahí
        Get-ChildItem -Path "sdk_source" -Filter *.h -Recurse | Copy-Item -Destination $finalPath -Force
        
        # 4. También los metemos en la carpeta 'sdk' por si el .vcxproj manda
        New-Item -ItemType Directory -Force -Path "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        Get-ChildItem -Path "sdk_source" -Filter *.h -Recurse | Copy-Item -Destination "sdk/bakkesmodsdk/include/bakkesmod/plugin" -Force

    - name: Build Solution
      shell: pwsh
      run: |
        # Crear versión vacía
        New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        
        # Compilar agregando la raíz actual (.) como ruta de inclusión extra
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$((Get-Item .).FullName)\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent= `
          /p:CL_AdditionalIncludeDirectories="$((Get-Item .).FullName)"

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin-DLL
        path: |
          **/*.dll
          **/*.set
