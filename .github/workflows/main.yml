name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Construct SDK Hierarchy
      shell: pwsh
      run: |
        # 1. Descargar los Headers oficiales del SDK (este sí los tiene)
        git clone https://github.com/bakkesmodorg/BakkesMod2-SDK.git sdk_temp
        
        # 2. Crear la ruta exacta que pide el error C1083
        $includeRoot = "sdk/bakkesmodsdk/include"
        $finalDir = "$includeRoot/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $finalDir
        
        # 3. Mover los headers (.h) a sus lugares correspondientes
        # Copiamos la carpeta 'bakkesmod' entera si existe en el SDK, o los archivos sueltos
        if (Test-Path "sdk_temp/include/bakkesmod") {
            Copy-Item -Path "sdk_temp/include/bakkesmod/*" -Destination "$includeRoot/bakkesmod" -Recurse -Force
        } else {
            Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $finalDir -Force
        }
        
        # 4. Verificación crítica (AQUÍ DEBE APARECER bakkesmodplugin.h)
        Write-Host "--- BUSCANDO bakkesmodplugin.h ---"
        Get-ChildItem -Path $includeRoot -Filter "bakkesmodplugin.h" -Recurse | Select-Object FullName

    - name: Build Solution
      shell: pwsh
      run: |
        # Asegurar version.h
        $projPath = "WhosBottingPlugin/WhosBottingPlugin/version.h"
        if (!(Test-Path "WhosBottingPlugin/WhosBottingPlugin")) { $projPath = "WhosBottingPlugin/version.h" }
        New-Item -ItemType File -Path $projPath -Force -Value ""
        
        $absPath = (Get-Item .).FullName
        
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
