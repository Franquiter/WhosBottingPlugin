name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Mock SDK
      shell: pwsh
      run: |
        # 1. Crear la ruta exacta
        $pluginPath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $pluginPath
        
        # 2. CREAR LOS ARCHIVOS QUE FALTAN (Stubs)
        # Esto define lo mínimo necesario para que C++ compile sin error 1083
        
        $bakkesHeader = @"
        #pragma once
        #include <string>
        #include <vector>
        class BakkesModPlugin { public: virtual void onLoad() = 0; virtual void onUnload() = 0; };
        "@
        Set-Content -Path "$pluginPath/bakkesmodplugin.h" -Value $bakkesHeader
        
        $settingsHeader = @"
        #pragma once
        class PluginSettingsWindow { public: virtual void RenderSettings() = 0; virtual std::string GetPluginName() = 0; };
        "@
        Set-Content -Path "$pluginPath/PluginSettingsWindow.h" -Value $settingsHeader

        $sdkHeader = @"
        #pragma once
        #define BAKKESMOD_PLUGIN_API __declspec(dllexport)
        "@
        Set-Content -Path "$pluginPath/bakkesmodsdk.h" -Value $sdkHeader

        # 3. Crear version.h
        New-Item -ItemType File -Path "WhosBottingPlugin/version.h" -Force -Value ""
        
        Write-Host "--- MOCK SDK CREADO ---"
        ls $pluginPath

    - name: Build Solution
      shell: pwsh
      run: |
        $absPath = (Get-Item .).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
