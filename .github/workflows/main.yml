name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Full Environment Mock
      shell: pwsh
      run: |
        $includeBase = "sdk/bakkesmodsdk/include"
        $bmPath = "$includeBase/bakkesmod"
        $cprPath = "$includeBase/cpr"
        
        New-Item -ItemType Directory -Force -Path "$bmPath/plugin"
        New-Item -ItemType Directory -Force -Path "$bmPath/wrappers"
        New-Item -ItemType Directory -Force -Path $cprPath

        # Escribimos el encabezado principal línea por línea
        $headerFile = "$bmPath/plugin/bakkesmodplugin.h"
        " #ifndef BAKKESMOD_MOCK_H" | Set-Content $headerFile
        " #define BAKKESMOD_MOCK_H" | Add-Content $headerFile
        " #include <string>" | Add-Content $headerFile
        " #include <vector>" | Add-Content $headerFile
        " #include <memory>" | Add-Content $headerFile
        " #define BAKKESMOD_PLUGIN_API __declspec(dllexport)" | Add-Content $headerFile
        " namespace BakkesMod {" | Add-Content $headerFile
        "   namespace Plugin {" | Add-Content $headerFile
        "     class BakkesModPlugin { public: std::shared_ptr<class GameWrapper> gameWrapper; std::shared_ptr<class CVarManagerWrapper> cvarManager; virtual void onLoad() = 0; virtual void onUnload() = 0; virtual void RenderSettings() = 0; };" | Add-Content $headerFile
        "     class PluginSettingsWindow { public: virtual void RenderSettings() = 0; virtual std::string GetPluginName() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };" | Add-Content $headerFile
        "     class PluginWindow { public: virtual void Render() = 0; virtual std::string GetMenuName() = 0; virtual std::string GetMenuTitle() = 0; virtual bool ShouldBlockInput() = 0; virtual bool IsActiveOverlay() = 0; virtual void OnOpen() = 0; virtual void OnClose() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };" | Add-Content $headerFile
        "   }" | Add-Content $headerFile
        "   class CVarWrapper { public: float getFloatValue(); int getIntValue(); std::string getStringValue(); bool getBoolValue(); void setValue(std::string val); void setValue(float val); void setValue(int val); bool operator!() const { return false; } };" | Add-Content $headerFile
        "   class CVarManagerWrapper { public: void log(std::string t); CVarWrapper getCvar(std::string name); CVarWrapper registerCvar(std::string n, std::string dv, std::string ds='', bool s=true, bool hmn=false, float mn=0, bool hmx=false, float mx=0, bool sv=true); };" | Add-Content $headerFile
        "   class GameWrapper { public: void HookEvent(std::string e, void* f); void UnhookEvent(std::string e); bool IsInGame(); };" | Add-Content $headerFile
        "   class ReplaySoccarWrapper { public: std::string GetId(); std::string GetDate(); int GetNumFrames(); };" | Add-Content $headerFile
        "   class ServerWrapper { public: bool IsNull(); };" | Add-Content $headerFile
        " }" | Add-Content $headerFile
        " using namespace BakkesMod; using namespace BakkesMod::Plugin;" | Add-Content $headerFile
        " #endif" | Add-Content $headerFile

        # Copiamos este archivo a todas las rutas que el plugin busca
        $others = @("plugin/PluginSettingsWindow.h", "plugin/bakkesmodsdk.h", "plugin/pluginwindow.h", "wrappers/cvarmanagerwrapper.h", "wrappers/gamewrapper.h")
        foreach ($f in $others) { Copy-Item $headerFile "$bmPath/$f" -Force }

        # Mock de CPR (Simplificado para evitar comillas conflictivas)
        $cprFile = "$cprPath/cpr.h"
        '#pragma once' | Set-Content $cprFile
        '#include <string>' | Add-Content $cprFile
        'namespace cpr { struct Response { int status_code; std::string text; std::string error; };' | Add-Content $cprFile
        'template <typename... Ts> Response Get(Ts... ts) { return {200, "{}", ""}; }' | Add-Content $cprFile
        'template <typename... Ts> Response Post(Ts... ts) { return {200, "{}", ""}; }' | Add-Content $cprFile
        'struct Url { Url(std::string u) : url(u) {} std::string url; }; struct Body { Body(std::string b) : body(b) {} std::string body; };' | Add-Content $cprFile
        'struct Header { Header(std::initializer_list<std::pair<const std::string, std::string>> l) {} }; }' | Add-Content $cprFile

        New-Item -ItemType File -Path "WhosBottingPlugin/version.h" -Force -Value "#define VERSION_MAJOR 1`n#define VERSION_MINOR 0"

    - name: Build Solution
      shell: pwsh
      run: |
        $absPath = (Get-Item .).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          "/p:IncludePath=$absPath\sdk\bakkesmodsdk\include;`$(IncludePath)" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
