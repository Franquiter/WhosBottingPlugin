name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Plugin Code
      uses: actions/checkout@v4
      with:
        path: plugin_code

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Force SDK
      shell: pwsh
      run: |
        # 1. Crear estructura de carpetas
        $includePath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $includePath
        
        # 2. Descargar Headers desde un Mirror estable (ZIP)
        $url = "https://github.com/bakkesmodorg/BakkesMod2-Plugins/archive/refs/heads/master.zip"
        Invoke-WebRequest -Uri $url -OutFile "sdk.zip"
        Expand-Archive -Path "sdk.zip" -DestinationPath "sdk_temp" -Force
        
        # 3. Copiar archivos .h de los ejemplos
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $includePath -Force
        
        # 4. DESCARGA MANUAL DE LOS ARCHIVOS BASE (Los que faltaban)
        # Bajamos directamente los headers esenciales del repo oficial de desarrollo
        $baseRawUrl = "https://raw.githubusercontent.com/thelooter/bakkesmodapi/master/include/bakkesmod/plugin"
        $files = @("bakkesmodplugin.h", "bakkesmodsdk.h", "PluginSettingsWindow.h", "bakkesmodplugin.h")
        
        foreach ($file in $files) {
            try {
                Invoke-WebRequest -Uri "$baseRawUrl/$file" -OutFile "$includePath/$file" -ErrorAction SilentlyContinue
            } catch {
                Write-Host "No se pudo bajar $file de la primera fuente, intentando secundaria..."
            }
        }

        # 5. Crear version.h
        New-Item -ItemType File -Path "plugin_code/WhosBottingPlugin/version.h" -Force -Value ""
        
        Write-Host "--- VERIFICACIÓN FINAL DE ARCHIVOS ---"
        ls $includePath

    - name: Build Solution
      shell: pwsh
      working-directory: plugin_code
      run: |
        $absPath = (Get-Item ..).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          plugin_code/**/*.dll
          plugin_code/**/*.set
