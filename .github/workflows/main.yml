name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Heavy Mock SDK V3
      shell: pwsh
      run: |
        $base = "sdk/bakkesmodsdk/include/bakkesmod"
        New-Item -ItemType Directory -Force -Path "$base/plugin"
        New-Item -ItemType Directory -Force -Path "$base/wrappers"

        $masterHeader = @"
        #ifndef BAKKESMOD_MOCK_H
        #define BAKKESMOD_MOCK_H

        #include <string>
        #include <vector>
        #include <memory>
        #include <map>
        #include <optional>
        #include <chrono>

        #define BAKKESMOD_PLUGIN_API __declspec(dllexport)

        namespace BakkesMod {
            class CVarWrapper { public: float getFloatValue(); int getIntValue(); std::string getStringValue(); };
            class CVarManagerWrapper { 
            public: 
                void log(std::string t); 
                CVarWrapper getCVar(std::string name);
                CVarWrapper registerCvar(std::string name, std::string defaultVal, std::string desc = "", bool searchAble = true, bool hasMin = false, float min = 0, bool hasMax = false, float max = 0, bool save = true);
            };
            class GameWrapper { 
            public: 
                void HookEvent(std::string e, void* f); 
                void UnhookEvent(std::string e);
                void Execute(void* f);
                bool IsInGame();
                bool IsInOnlineGame();
            };
            class BakkesModPlugin { 
            public: 
                std::shared_ptr<GameWrapper> gameWrapper; 
                std::shared_ptr<CVarManagerWrapper> cvarManager; 
                virtual void onLoad() = 0; 
                virtual void onUnload() = 0; 
            };
            class PluginSettingsWindow { public: virtual void RenderSettings() = 0; virtual std::string GetPluginName() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };
            class PluginWindow { public: virtual void Render() = 0; virtual std::string GetMenuName() = 0; virtual std::string GetMenuTitle() = 0; virtual bool ShouldBlockInput() = 0; virtual bool IsActiveOverlay() = 0; virtual void OnOpen() = 0; virtual void OnClose() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };
        }

        // Compatibilidad con código que no usa el namespace explícito
        using namespace BakkesMod;
        
        // Stubs para clases adicionales detectadas en el log
        class ServerWrapper {};
        class ReplaySoccarWrapper {};

        #endif
        "@

        $files = @(
            "plugin/bakkesmodplugin.h", "plugin/PluginSettingsWindow.h", "plugin/bakkesmodsdk.h",
            "plugin/pluginwindow.h", "wrappers/cvarmanagerwrapper.h", "wrappers/gamewrapper.h",
            "wrappers/wrapperstructs.h", "wrappers/arraywrapper.h", "wrappers/cvarwrapper.h"
        )

        foreach ($f in $files) {
            Set-Content -Path "$base/$f" -Value $masterHeader
        }

        # Crear archivo de versión
        New-Item -ItemType File -Path "WhosBottingPlugin/version.h" -Force -Value ""
        
    - name: Build Solution
      shell: pwsh
      run: |
        $absPath = (Get-Item .).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
