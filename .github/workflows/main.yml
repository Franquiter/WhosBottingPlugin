name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Force SDK
      shell: pwsh
      run: |
        # 1. Clonamos el SDK
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # 2. Creamos la estructura EXACTA que el compilador pide en el log
        # El log dice: ID:\...\sdk\bakkesmodsdk\include
        # Y el código busca: bakkesmod/plugin/bakkesmodplugin.h
        $finalPath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $finalPath
        
        # 3. Copiamos todos los archivos .h directamente ahí
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $finalPath -Force
        
        # 4. Verificación visual en el log (para nosotros)
        echo "Contenido de la carpeta creada:"
        ls $finalPath

    - name: Build Solution
      shell: pwsh
      run: |
        # Creamos el version.h para que no salte el script de PS
        New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        
        # Forzamos a MSBuild a ignorar los scripts automáticos y usar nuestra ruta
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$((Get-Item .).FullName)\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/*.dll
          **/*.set
