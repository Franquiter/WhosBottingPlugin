name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Full Mock SDK
      shell: pwsh
      run: |
        $basePath = "sdk/bakkesmodsdk/include/bakkesmod"
        $pluginPath = "$basePath/plugin"
        $wrapperPath = "$basePath/wrappers"
        New-Item -ItemType Directory -Force -Path $pluginPath
        New-Item -ItemType Directory -Force -Path $wrapperPath
        
        # 1. Headers en /plugin/
        Set-Content -Path "$pluginPath/bakkesmodplugin.h" -Value @"
        #pragma once
        #include <string>
        #include <memory>
        class CVarManagerWrapper;
        class GameWrapper;
        class BakkesModPlugin { 
        public: 
            std::shared_ptr<GameWrapper> gameWrapper;
            std::shared_ptr<CVarManagerWrapper> cvarManager;
            virtual void onLoad() = 0; 
            virtual void onUnload() = 0; 
        };
        "@

        Set-Content -Path "$pluginPath/PluginSettingsWindow.h" -Value @"
        #pragma once
        #include <string>
        class PluginSettingsWindow { 
        public: 
            virtual void RenderSettings() = 0; 
            virtual std::string GetPluginName() = 0; 
        };
        "@

        # Otros archivos que el log pidió
        Set-Content -Path "$pluginPath/bakkesmodsdk.h" -Value "#pragma once`n#define BAKKESMOD_PLUGIN_API __declspec(dllexport)"
        Set-Content -Path "$pluginPath/pluginwindow.h" -Value "#pragma once"

        # 2. Headers en /wrappers/ (El que causó el error C1083)
        Set-Content -Path "$wrapperPath/cvarmanagerwrapper.h" -Value @"
        #pragma once
        #include <string>
        class CVarManagerWrapper {
        public:
            void log(std::string text);
        };
        "@

        # 3. Crear version.h
        New-Item -ItemType File -Path "WhosBottingPlugin/version.h" -Force -Value ""
        
        Write-Host "--- MOCK SDK AMPLIADO CREADO ---"

    - name: Build Solution
      shell: pwsh
      run: |
        $absPath = (Get-Item .).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
