name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Force BakkesMod SDK Structure
      shell: pwsh
      run: |
        # 1. Bajamos el SDK completo
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_source
        
        # 2. Creamos la carpeta EXACTA que pide tu log (D:\...\sdk\bakkesmodsdk\include)
        $includePath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $includePath
        
        # 3. Buscamos TODOS los archivos .h en el SDK y los metemos ahí
        # Esto soluciona los 17 errores C1083 de un solo golpe
        Get-ChildItem -Path "sdk_source" -Filter *.h -Recurse | Copy-Item -Destination $includePath -Force
        
        # 4. Establecemos la variable de entorno para MSBuild
        $fullPath = (Get-Item .).FullName + "\sdk"
        echo "BAKKESMOD_SDK=$fullPath" >> $env:GITHUB_ENV

    - name: Build Solution
      shell: pwsh
      run: |
        # Creamos el archivo de versión manual para que no falle el script
        New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        
        # Compilamos desactivando los eventos que están rompiendo el proceso
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="${{ env.BAKKESMOD_SDK }}" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin-DLL
        path: |
          **/*.dll
          **/*.set
