name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Structural Fix SDK
      shell: pwsh
      run: |
        # 1. Clonar SDK
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # 2. Crear la carpeta raíz de inclusión
        $includeRoot = "sdk/bakkesmodsdk/include"
        
        # 3. Crear la subcarpeta jerárquica EXACTA que pide el #include
        # Si el código dice <bakkesmod/plugin/file.h>, necesitamos:
        # include/bakkesmod/plugin/file.h
        $finalPath = "$includeRoot/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $finalPath
        
        # 4. Copiar todos los .h allí
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $finalPath -Force
        
        # Verificación para el log
        echo "Buscando bakkesmodplugin.h en:"
        Get-ChildItem -Path $includeRoot -Filter "bakkesmodplugin.h" -Recurse

    - name: Build Solution
      shell: pwsh
      run: |
        # Evitar fallos por el script de versionado original
        if (Test-Path "WhosBottingPlugin/update_version.ps1") {
          echo "Hacks para saltar el pre-build script..."
          New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        }

        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$((Get-Item .).FullName)\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/*.dll
          **/*.set
