name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download BakkesMod SDK
      run: |
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk
        echo "BAKKESMOD_SDK=$(pwd)/sdk" >> $GITHUB_ENV

    - name: Build Solution
      run: |
        # Creamos un archivo de version vacio para evitar el error del script de powershell
        echo "" > WhosBottingPlugin/version.h
        msbuild WhosBottingPlugin.sln /p:Configuration=Release /p:Platform="x64" /p:BakkesModPath="${{ env.BAKKESMOD_SDK }}"

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Plugin-Files
        path: |
          **/*.dll
          **/*.set
