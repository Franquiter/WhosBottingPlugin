name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Force SDK Path
      shell: pwsh
      run: |
        # 1. Bajamos el SDK (es pequeño, así que clonamos todo)
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # 2. Creamos la ruta de destino EXACTA que pide tu proyecto
        $targetPath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $targetPath
        
        # 3. Buscamos TODOS los archivos .h en lo que bajamos y los movemos al destino
        # Esto evita errores si la carpeta se llama distinto
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $targetPath -Force
        
        echo "Archivos listos en $targetPath :"
        ls $targetPath

    - name: Build Solution
      shell: pwsh
      run: |
        # Crear version.h vacío para evitar que el script de pre-build falle
        if (!(Test-Path "WhosBottingPlugin/version.h")) {
          New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        }
        
        # Compilación final
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$((Get-Item .).FullName)\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
