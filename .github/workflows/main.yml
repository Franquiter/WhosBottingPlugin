name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Full Environment Mock
      shell: pwsh
      run: |
        $includeBase = "sdk/bakkesmodsdk/include"
        $bmPath = "$includeBase/bakkesmod"
        $cprPath = "$includeBase/cpr"
        New-Item -ItemType Directory -Force -Path "$bmPath/plugin", "$bmPath/wrappers", $cprPath

        # --- MOCK DE BAKKESMOD ---
        $headerFile = "$bmPath/plugin/bakkesmodplugin.h"
        '#pragma once' | Set-Content $headerFile
        '#include <string>' | Add-Content $headerFile
        '#include <vector>' | Add-Content $headerFile
        '#include <memory>' | Add-Content $headerFile
        '#include <optional>' | Add-Content $headerFile
        '#include <chrono>' | Add-Content $headerFile
        '#define BAKKESMOD_PLUGIN_API __declspec(dllexport)' | Add-Content $headerFile
        'namespace BakkesMod { namespace Plugin { ' | Add-Content $headerFile
        'class CVarWrapper { public: float getFloatValue(); int getIntValue(); std::string getStringValue(); bool getBoolValue(); void setValue(std::string v); bool operator!() const { return false; } };' | Add-Content $headerFile
        'class CVarManagerWrapper { public: void log(std::string t); CVarWrapper getCvar(std::string n); CVarWrapper registerCvar(std::string n, std::string dv, std::string ds="", bool s=true, bool hmn=false, float mn=0, bool hmx=false, float mx=0, bool sv=true); };' | Add-Content $headerFile
        'class GameWrapper { public: void HookEvent(std::string e, void* f); void UnhookEvent(std::string e); bool IsInGame(); };' | Add-Content $headerFile
        'class BakkesModPlugin { public: std::shared_ptr<GameWrapper> gameWrapper; std::shared_ptr<CVarManagerWrapper> cvarManager; virtual void onLoad() = 0; virtual void onUnload() = 0; virtual void RenderSettings() = 0; };' | Add-Content $headerFile
        '} }' | Add-Content $headerFile
        'using namespace BakkesMod::Plugin;' | Add-Content $headerFile
        
        $others = @("plugin/PluginSettingsWindow.h", "plugin/bakkesmodsdk.h", "plugin/pluginwindow.h", "wrappers/cvarmanagerwrapper.h", "wrappers/gamewrapper.h")
        foreach ($f in $others) { Copy-Item $headerFile "$bmPath/$f" -Force }

        # --- MOCK DE CPR ---
        $cprFile = "$cprPath/cpr.h"
        '#pragma once' | Set-Content $cprFile
        '#include <string>' | Add-Content $cprFile
        '#include <initializer_list>' | Add-Content $cprFile
        '#include <utility>' | Add-Content $cprFile
        'namespace cpr { ' | Add-Content $cprFile
        '  struct Response { int status_code; std::string text; std::string error; };' | Add-Content $cprFile
        '  struct Url { Url(std::string u) : url(u) {} std::string url; };' | Add-Content $cprFile
        '  struct Body { Body(std::string b) : body(b) {} std::string body; };' | Add-Content $cprFile
        '  struct Header { Header(std::initializer_list<std::pair<std::string, std::string>> l) {} };' | Add-Content $cprFile
        '  struct Timeout { Timeout(long m) {} };' | Add-Content $cprFile
        '  struct ConnectTimeout { ConnectTimeout(long m) {} };' | Add-Content $cprFile
        '  template <typename... Ts> Response Post(Ts... ts) { return {200, "{}", ""}; }' | Add-Content $cprFile
        '  template <typename... Ts> Response Get(Ts... ts) { return {200, "{}", ""}; }' | Add-Content $cprFile
        '}' | Add-Content $cprFile

        New-Item -ItemType File -Path "WhosBottingPlugin/version.h" -Force -Value "#define VERSION_MAJOR 1`n#define VERSION_MINOR 0"

        $absPath = (Get-Item .).FullName
        $propsFile = "Directory.Build.props"
        '<Project><PropertyGroup>' | Set-Content $propsFile
        " <IncludePath>`$(ProjectDir);$absPath\sdk\bakkesmodsdk\include;`$(IncludePath)</IncludePath>" | Add-Content $propsFile
        " <BakkesModPath>$absPath\sdk</BakkesModPath>" | Add-Content $propsFile
        '</PropertyGroup></Project>' | Add-Content $propsFile

    - name: Build Solution
      shell: pwsh
      run: |
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
