name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Plugin Code
      uses: actions/checkout@v4
      with:
        path: my_code

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Get Official SDK Template
      shell: pwsh
      run: |
        # 1. Clonamos la plantilla que SÍ trae los headers core
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_full
        
        # 2. Crear la estructura que pide tu compilador
        $targetDir = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $targetDir
        
        # 3. Intentar localizar los archivos core en el sistema o bajarlos de un mirror activo
        # Usamos el mirror de C++ de BakkesMod que es más estable
        $headers = @(
            "https://raw.githubusercontent.com/thelooter/bakkesmodapi/master/include/bakkesmod/plugin/bakkesmodplugin.h",
            "https://raw.githubusercontent.com/thelooter/bakkesmodapi/master/include/bakkesmod/plugin/bakkesmodsdk.h",
            "https://raw.githubusercontent.com/thelooter/bakkesmodapi/master/include/bakkesmod/plugin/PluginSettingsWindow.h"
        )
        
        foreach ($url in $headers) {
            $name = Split-Path $url -Leaf
            Write-Host "Descargando crítico: $name"
            Invoke-WebRequest -Uri $url -OutFile "$targetDir/$name" -UseBasicParsing
        }

        # 4. Copiar los headers adicionales del repo de plugins
        Get-ChildItem -Path "sdk_full" -Filter *.h -Recurse | Copy-Item -Destination $targetDir -Force
        
        # 5. Mover tu código a la raíz de trabajo para MSBuild
        Copy-Item -Path "my_code/*" -Destination "." -Recurse -Force
        New-Item -ItemType File -Path "WhosBottingPlugin/version.h" -Force -Value ""

        Write-Host "--- VERIFICACIÓN DE HEADERS CRÍTICOS ---"
        if (Test-Path "$targetDir/bakkesmodplugin.h") { Write-Host "✅ bakkesmodplugin.h ENCONTRADO" }
        else { Write-Host "❌ FALLO CRÍTICO: No se pudo obtener el header" }

    - name: Build Solution
      shell: pwsh
      run: |
        $absPath = (Get-Item .).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/*.dll
          **/*.set
