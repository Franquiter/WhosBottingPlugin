name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Heavy Mock SDK
      shell: pwsh
      run: |
        $base = "sdk/bakkesmodsdk/include/bakkesmod"
        New-Item -ItemType Directory -Force -Path "$base/plugin"
        New-Item -ItemType Directory -Force -Path "$base/wrappers"
        New-Item -ItemType Directory -Force -Path "$base/wrappers/GameObject"

        # 1. Definición Maestra de Clases (Para evitar que el compilador se detenga)
        $masterHeader = @"
        #pragma once
        #include <string>
        #include <vector>
        #include <memory>
        #include <map>

        #define BAKKESMOD_PLUGIN_API __declspec(dllexport)

        class CVarManagerWrapper { public: void log(std::string t); };
        class GameWrapper { public: void HookEvent(std::string e, void* f); };
        class BakkesModPlugin { 
        public: 
            std::shared_ptr<GameWrapper> gameWrapper; 
            std::shared_ptr<CVarManagerWrapper> cvarManager; 
            virtual void onLoad() = 0; 
            virtual void onUnload() = 0; 
        };
        class PluginSettingsWindow { public: virtual void RenderSettings() = 0; virtual std::string GetPluginName() = 0; };
        "@

        # 2. Crear todos los archivos que el compilador busque apuntando al Maestro
        $files = @(
            "plugin/bakkesmodplugin.h", "plugin/PluginSettingsWindow.h", "plugin/bakkesmodsdk.h",
            "plugin/pluginwindow.h", "wrappers/cvarmanagerwrapper.h", "wrappers/gamewrapper.h",
            "wrappers/wrapperstructs.h", "wrappers/arraywrapper.h", "wrappers/cvarwrapper.h",
            "wrappers/linewrapper.h", "wrappers/mmrwrapper.h"
        )

        foreach ($f in $files) {
            Set-Content -Path "$base/$f" -Value $masterHeader
        }

        # 3. Crear version.h
        New-Item -ItemType File -Path "WhosBottingPlugin/version.h" -Force -Value ""
        
        Write-Host "--- OMNI-MOCK SDK CREADO ---"

    - name: Build Solution
      shell: pwsh
      run: |
        $absPath = (Get-Item .).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
