name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Full Environment Mock
      shell: pwsh
      run: |
        $includeBase = "sdk/bakkesmodsdk/include"
        $bmPath = "$includeBase/bakkesmod"
        $cprPath = "$includeBase/cpr"
        
        New-Item -ItemType Directory -Force -Path "$bmPath/plugin"
        New-Item -ItemType Directory -Force -Path "$bmPath/wrappers"
        New-Item -ItemType Directory -Force -Path $cprPath

        # Creamos el archivo BakkesMod línea por línea para evitar errores de Here-String
        $bmContent = @(
            "#ifndef BAKKESMOD_MOCK_H",
            "#define BAKKESMOD_MOCK_H",
            "#include <string>",
            "#include <vector>",
            "#include <memory>",
            "#include <optional>",
            "#include <chrono>",
            "#define BAKKESMOD_PLUGIN_API __declspec(dllexport)",
            "namespace BakkesMod {",
            "    namespace Plugin {",
            "        class BakkesModPlugin {",
            "        public:",
            "            std::shared_ptr<class GameWrapper> gameWrapper;",
            "            std::shared_ptr<class CVarManagerWrapper> cvarManager;",
            "            virtual void onLoad() = 0;",
            "            virtual void onUnload() = 0;",
            "            virtual void RenderSettings() = 0;",
            "        };",
            "        class PluginSettingsWindow { public: virtual void RenderSettings() = 0; virtual std::string GetPluginName() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };",
            "        class PluginWindow { public: virtual void Render() = 0; virtual std::string GetMenuName() = 0; virtual std::string GetMenuTitle() = 0; virtual bool ShouldBlockInput() = 0; virtual bool IsActiveOverlay() = 0; virtual void OnOpen() = 0; virtual void OnClose() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };",
            "    }",
            "    class CVarWrapper {",
            "    public:",
            "        float getFloatValue(); int getIntValue(); std::string getStringValue(); bool getBoolValue();",
            "        void setValue(std::string val); void setValue(float val); void setValue(int val);",
            "        bool operator!() const { return false; }",
            "    };",
            "    class CVarManagerWrapper {",
            "    public:",
            "        void log(std::string t);",
            "        CVarWrapper getCvar(std::string name);",
            "        CVarWrapper registerCvar(std::string name, std::string defaultVal, std::string desc = \"\", bool searchAble = true, bool hasMin = false, float min = 0, bool hasMax = false, float max = 0, bool save = true);",
            "    };",
            "    class GameWrapper { public: void HookEvent(std::string e, void* f); void UnhookEvent(std::string e); bool IsInGame(); };",
            "    class ReplaySoccarWrapper { public: std::string GetId(); std::string GetDate(); int GetNumFrames(); };",
            "    class ServerWrapper { public: bool IsNull(); };",
            "}",
            "using namespace BakkesMod;",
            "using namespace BakkesMod::Plugin;",
