name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Fix SDK Path
      shell: pwsh
      run: |
        # 1. Bajamos el SDK oficial
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # 2. Creamos la ruta EXACTA que espera el compilador según el log
        $targetPath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        if (!(Test-Path $targetPath)) { New-Item -ItemType Directory -Force -Path $targetPath }
        
        # 3. Copiamos los archivos .h desde la carpeta 'include/bakkesmod/plugin' del repo clonado
        # Nota: El repo de BakkesMod tiene los archivos en esa subestructura
        cp sdk_temp/include/bakkesmod/plugin/* $targetPath/
        
        echo "Verificando archivos en el destino:"
        ls $targetPath

    - name: Build Solution
      shell: pwsh
      run: |
        # Creamos el version.h manual
        New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        
        # Compilación limpia ignorando eventos previos que puedan fallar
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$((Get-Item .).FullName)\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin-DLL
        path: |
          **/*.dll
          **/*.set
