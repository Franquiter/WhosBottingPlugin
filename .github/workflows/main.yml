name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Force SDK Structure
      shell: pwsh
      run: |
        # 1. Clonar el SDK a una carpeta temporal
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # 2. Crear la ruta exacta que el compilador está gritando por encontrar
        $dest = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        if (!(Test-Path $dest)) { New-Item -ItemType Directory -Force -Path $dest }
        
        # 3. Buscar todos los .h en el clon y meterlos en la carpeta final
        # No importa donde estén en sdk_temp, los movemos al destino correcto
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $dest -Force
        
        # 4. Verificación visual en el log
        Write-Host "--- CONTENIDO DE LA CARPETA SDK ---"
        Get-ChildItem -Path $dest

    - name: Build Solution
      shell: pwsh
      run: |
        # Crear version.h en el lugar correcto (según tu log es la subcarpeta)
        $vPath = "WhosBottingPlugin/version.h"
        if (!(Test-Path $vPath)) { New-Item -ItemType File -Path $vPath -Force -Value "" }

        # Forzamos BakkesModPath para que coincida con la estructura
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$((Get-Item .).FullName)\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/*.dll
          **/*.set
