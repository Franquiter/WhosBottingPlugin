name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Force SDK Structure
      shell: pwsh
      run: |
        # 1. Clonar el SDK oficial
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # 2. Definir la ruta base que espera el compilador (absoluta)
        $baseDir = (Get-Item .).FullName
        $includePath = "$baseDir\sdk\bakkesmodsdk\include\bakkesmod\plugin"
        
        # 3. Crear las carpetas una por una para asegurar éxito
        if (!(Test-Path $includePath)) { 
            New-Item -ItemType Directory -Force -Path $includePath 
        }
        
        # 4. Copiar TODOS los .h desde el clon a la subcarpeta final
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $includePath -Force
        
        # Verificación visual: Si esto no muestra archivos, el build fallará
        Write-Host "Archivos en $includePath :"
        ls $includePath

    - name: Build Solution
      shell: pwsh
      run: |
        # Crear version.h en la subcarpeta del código fuente
        $vPath = "WhosBottingPlugin/version.h"
        New-Item -ItemType File -Path $vPath -Force -Value ""
        
        $baseDir = (Get-Item .).FullName
        
        # Compilar forzando el BakkesModPath absoluto
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$baseDir\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
