- name: Create Props File
      shell: pwsh
      run: |
        $absPath = (Get-Item .).FullName
        $xml = @"
        <Project>
          <PropertyGroup>
            <IncludePath>`$(ProjectDir);$absPath\sdk\bakkesmodsdk\include;`$(IncludePath)</IncludePath>
            <BakkesModPath>$absPath\sdk</BakkesModPath>
          </PropertyGroup>
        </Project>
        "@
        $xml | Set-Content "Directory.Build.props"

    - name: Build Solution
      shell: pwsh
      run: |
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Check DLL existence
      shell: pwsh
      run: |
        Write-Host "Buscando archivos DLL generados..."
        Get-ChildItem -Recurse -Filter *.dll | Select-Object FullName
