name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Construct SDK Hierarchy
      shell: pwsh
      run: |
        # 1. Descargar SDK limpio
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        
        # 2. Crear la ruta exacta que pide el error C1083
        # El compilador busca en: sdk/bakkesmodsdk/include
        # El código pide: bakkesmod/plugin/archivo.h
        $finalDir = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $finalDir
        
        # 3. Mover TODOS los archivos .h encontrados al fondo de esa ruta
        Get-ChildItem -Path "sdk_temp" -Filter *.h -Recurse | Copy-Item -Destination $finalDir -Force
        
        # 4. Verificación crítica (Esto debe mostrar archivos en el log)
        Write-Host "--- ARCHIVOS ENCONTRADOS EN LA RUTA FINAL ---"
        Get-ChildItem -Path $finalDir | Select-Object Name

    - name: Build Solution
      shell: pwsh
      run: |
        # Asegurar version.h en la carpeta del proyecto
        $projPath = "WhosBottingPlugin/WhosBottingPlugin/version.h"
        if (!(Test-Path "WhosBottingPlugin/WhosBottingPlugin")) { $projPath = "WhosBottingPlugin/version.h" }
        New-Item -ItemType File -Path $projPath -Force -Value ""
        
        # Obtener ruta absoluta para evitar confusiones de MSBuild
        $absPath = (Get-Item .).FullName
        
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
