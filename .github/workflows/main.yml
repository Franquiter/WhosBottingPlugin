name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Plugin Code
      uses: actions/checkout@v4
      with:
        path: plugin_code

    - name: Checkout BakkesMod SDK (Public Mirror)
      uses: actions/checkout@v4
      with:
        repository: bakkesmodorg/BakkesMod2-Plugins
        path: sdk_folder

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Prepare SDK and Version
      shell: pwsh
      run: |
        # 1. Crear la ruta que el compilador busca: sdk/bakkesmodsdk/include/bakkesmod/plugin
        $includePath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $includePath
        
        # 2. Copiar los headers desde el repo que acabamos de bajar
        # Buscamos todos los .h en el repo del SDK y los metemos en la carpeta plugin
        Get-ChildItem -Path "sdk_folder" -Filter *.h -Recurse | Copy-Item -Destination $includePath -Force
        
        # 3. Crear version.h vacío para evitar el error del script original
        # Lo ponemos en todas las posibles ubicaciones para estar seguros
        New-Item -ItemType File -Path "plugin_code/WhosBottingPlugin/version.h" -Force -Value ""
        New-Item -ItemType File -Path "plugin_code/version.h" -Force -Value ""

        Write-Host "--- Estructura creada con éxito ---"
        ls $includePath

    - name: Build Solution
      shell: pwsh
      working-directory: plugin_code
      run: |
        $absPath = (Get-Item ..).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          **/Release/*.dll
          **/*.set
