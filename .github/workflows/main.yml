name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Plugin Code
      uses: actions/checkout@v4
      with:
        path: plugin_code

    - name: Checkout BakkesMod SDK (Full Headers)
      uses: actions/checkout@v4
      with:
        repository: thelooter/bakkesmodapi
        path: sdk_folder

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Prepare SDK and Version
      shell: pwsh
      run: |
        # 1. Crear la ruta exacta: sdk/bakkesmodsdk/include/bakkesmod/plugin
        $includePath = "sdk/bakkesmodsdk/include/bakkesmod/plugin"
        New-Item -ItemType Directory -Force -Path $includePath
        
        # 2. Copiar los headers desde el nuevo repo (este tiene los archivos base)
        # Primero intentamos copiar la estructura completa de headers
        if (Test-Path "sdk_folder/include/bakkesmod") {
            Copy-Item -Path "sdk_folder/include/bakkesmod/*" -Destination "sdk/bakkesmodsdk/include/bakkesmod" -Recurse -Force
        }
        
        # 3. Asegurar que los archivos específicos estén en /plugin/ por si acaso
        Get-ChildItem -Path "sdk_folder" -Filter *.h -Recurse | Copy-Item -Destination $includePath -Force
        
        # 4. Crear version.h para el plugin
        New-Item -ItemType File -Path "plugin_code/WhosBottingPlugin/version.h" -Force -Value ""
        New-Item -ItemType File -Path "plugin_code/version.h" -Force -Value ""

        Write-Host "--- LISTA DE HEADERS ENCONTRADOS ---"
        Get-ChildItem -Path "sdk/bakkesmodsdk/include" -Filter *.h -Recurse | Select-Object Name

    - name: Build Solution
      shell: pwsh
      working-directory: plugin_code
      run: |
        $absPath = (Get-Item ..).FullName
        msbuild WhosBottingPlugin.sln `
          /p:Configuration=Release `
          /p:Platform="x64" `
          /p:BakkesModPath="$absPath\sdk" `
          /p:PreBuildEvent= `
          /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WhosBotting-Plugin
        path: |
          plugin_code/**/*.dll
          plugin_code/**/*.set
