name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Create Full Environment Mock
      shell: pwsh
      run: |
        $includeBase = "sdk/bakkesmodsdk/include"
        $bmPath = "$includeBase/bakkesmod"
        $cprPath = "$includeBase/cpr"
        
        New-Item -ItemType Directory -Force -Path "$bmPath/plugin"
        New-Item -ItemType Directory -Force -Path "$bmPath/wrappers"
        New-Item -ItemType Directory -Force -Path $cprPath

        $masterHeader = @"
        #ifndef BAKKESMOD_MOCK_H
        #define BAKKESMOD_MOCK_H
        #include <string>
        #include <vector>
        #include <memory>
        #include <optional>
        #include <chrono>

        #define BAKKESMOD_PLUGIN_API __declspec(dllexport)

        namespace BakkesMod {
            namespace Plugin {
                class BakkesModPlugin { 
                public: 
                    std::shared_ptr<class GameWrapper> gameWrapper; 
                    std::shared_ptr<class CVarManagerWrapper> cvarManager; 
                    virtual void onLoad() = 0; 
                    virtual void onUnload() = 0; 
                    virtual void RenderSettings() = 0;
                };
                class PluginSettingsWindow { public: virtual void RenderSettings() = 0; virtual std::string GetPluginName() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };
                class PluginWindow { public: virtual void Render() = 0; virtual std::string GetMenuName() = 0; virtual std::string GetMenuTitle() = 0; virtual bool ShouldBlockInput() = 0; virtual bool IsActiveOverlay() = 0; virtual void OnOpen() = 0; virtual void OnClose() = 0; virtual void SetImGuiContext(uintptr_t ctx) = 0; };
            }
