name: Build Plugin
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download and Fix SDK Path
      shell: pwsh
      run: |
        # Bajamos el SDK
        git clone https://github.com/bakkesmodorg/BakkesMod2-Plugins.git sdk_temp
        # Creamos la estructura de carpetas que espera el archivo .vcxproj (según tu log)
        mkdir -p sdk/bakkesmodsdk/include/bakkesmod/plugin
        # Movemos los archivos necesarios al lugar correcto
        cp sdk_temp/bakkesmod/plugin/* sdk/bakkesmodsdk/include/bakkesmod/plugin/
        # Guardamos la ruta
        echo "BAKKESMOD_SDK=$((Get-Item .).FullName)\sdk" >> $env:GITHUB_ENV

    - name: Build Solution
      shell: pwsh
      run: |
        # Creamos el archivo de versión para evitar el error de PowerShell
        New-Item -Path "WhosBottingPlugin" -Name "version.h" -ItemType "file" -Value "" -Force
        # Compilamos desactivando los eventos que dan error
        msbuild WhosBottingPlugin.sln /p:Configuration=Release /p:Platform="x64" /p:BakkesModPath="${{ env.BAKKESMOD_SDK }}" /p:PreBuildEvent= /p:PostBuildEvent=

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Plugin-Final
        path: |
          **/*.dll
          **/*.set
